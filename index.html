<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSL Face Rater</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f1efe8;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --text: #1a1a1a;
    --text2: #666660;
    --text3: #999991;
    --info-bg: #e6f1fb;
    --info-text: #185fa5;
    --info-border: rgba(24,95,165,0.3);
    --success: #1D9E75;
    --warn: #EF9F27;
    --danger: #E24B4A;
    --radius: 12px;
    --radius-sm: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --surface: #262624;
      --surface2: #2e2e2b;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --text: #f0ede6;
      --text2: #a8a59e;
      --text3: #6e6c66;
      --info-bg: #0c2a45;
      --info-text: #85b7eb;
      --info-border: rgba(133,183,235,0.25);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .container { width: 100%; max-width: 500px; }

  h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .subtitle { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; }

  /* API key setup */
  .setup-card {
    background: var(--info-bg);
    border: 0.5px solid var(--info-border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  .setup-card label { font-size: 13px; color: var(--info-text); font-weight: 500; display: block; margin-bottom: 6px; }
  .setup-card .key-row { display: flex; gap: 8px; }
  .setup-card input {
    flex: 1;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--info-border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-family: monospace;
    outline: none;
  }
  .setup-card input:focus { box-shadow: 0 0 0 2px var(--info-border); }
  .setup-card .hint { font-size: 12px; color: var(--info-text); margin-top: 6px; opacity: 0.8; }

  /* Mode tabs */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab {
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    border: 0.5px solid var(--border2);
    background: var(--surface);
    cursor: pointer;
    color: var(--text2);
    transition: background 0.15s;
  }
  .tab.active { background: var(--surface2); color: var(--text); font-weight: 500; }
  .tab:hover:not(.active) { background: var(--surface2); }

  /* Preview */
  .preview-box {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--surface2);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  #video, #preview-img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: var(--radius);
  }
  #preview-img { display: none; }
  .placeholder { text-align: center; color: var(--text3); }
  .placeholder svg { display: block; margin: 0 auto 10px; opacity: 0.5; }

  /* Buttons */
  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    flex: 1;
    min-width: 110px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s, transform 0.1s;
    font-family: inherit;
  }
  button:hover:not(:disabled) { background: var(--surface2); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.38; cursor: default; }
  button.primary {
    background: var(--info-bg);
    color: var(--info-text);
    border-color: var(--info-border);
    font-weight: 500;
  }
  #btn-retake { width: 100%; flex: none; margin-top: 8px; }
  #file-input { display: none; }

  /* Loading */
  .loading {
    display: none;
    align-items: center;
    gap: 10px;
    color: var(--text2);
    font-size: 14px;
    margin-top: 1rem;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border2);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

  /* Result */
  .result-card {
    display: none;
    margin-top: 1.25rem;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
  }
  .score-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .score-num { font-size: 52px; font-weight: 500; line-height: 1; }
  .score-denom { font-size: 16px; color: var(--text2); }
  .score-emoji { font-size: 32px; }
  .bar-bg { height: 8px; background: var(--surface2); border-radius: 999px; margin-bottom: 1rem; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 1s cubic-bezier(.4,0,.2,1); width: 0%; }
  .psl-tier { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
  .verdict { font-size: 15px; line-height: 1.7; color: var(--text); }
  .traits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .trait {
    font-size: 12px; padding: 4px 12px;
    border-radius: 999px;
    background: var(--surface2);
    color: var(--text2);
    border: 0.5px solid var(--border);
  }
  .psl-ref { margin-top: 1.25rem; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .psl-ref summary { padding: 10px 14px; font-size: 13px; color: var(--text2); cursor: pointer; user-select: none; }
  .psl-ref summary:hover { background: var(--surface2); }
  .psl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .psl-table td { padding: 7px 14px; border-top: 0.5px solid var(--border); vertical-align: top; }
  .psl-table td:first-child { font-weight: 500; white-space: nowrap; width: 60px; }
  .psl-table tr.active-row td { background: var(--surface2); }
</style>
</head>
<body>
<div class="container">
  <h1>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <circle cx="12" cy="8" r="4"/><path d="M6 20v-1a6 6 0 0 1 12 0v1"/>
    </svg>
    PSL Face Rater
  </h1>
  <p class="subtitle">Take a photo or upload one — get rated on the Pretty Scale Looks (PSL) scale</p>

  <div class="tabs">
    <span class="tab active" id="tab-camera" onclick="switchMode('camera')">📷 Camera</span>
    <span class="tab" id="tab-upload" onclick="switchMode('upload')">🖼 Upload</span>
  </div>

  <div class="preview-box" id="preview-box">
    <video id="video" autoplay playsinline></video>
    <img id="preview-img" alt="Captured photo" />
    <div class="placeholder" id="placeholder">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="8" r="5"/><path d="M3 21a9 9 0 0 1 18 0"/></svg>
      <span style="font-size:14px;">No photo yet</span>
    </div>
  </div>

  <div class="error" id="error-msg"></div>

  <div class="btn-row">
    <button id="btn-start" onclick="startCamera()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M20.94 13A8.94 8.94 0 0 0 21 12a9 9 0 1 0-9 9 8.94 8.94 0 0 0 1-.06"/><path d="M3.27 6.96A9 9 0 0 0 3 12"/></svg>
      Start camera
    </button>
    <button id="btn-snap" onclick="snap()" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Snap
    </button>
    <button id="btn-upload" onclick="document.getElementById('file-input').click()" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Choose photo
    </button>
    <button id="btn-rate" class="primary" onclick="rateFace()" disabled>
      ✨ Rate me
    </button>
  </div>
  <button id="btn-retake" onclick="retake()" style="display:none">
    🔄 Retake / new photo
  </button>

  <input type="file" id="file-input" accept="image/*" onchange="loadFile(event)" />

  <div class="loading" id="loading">
    <div class="spinner"></div> Analysing your face…
  </div>

  <div class="result-card" id="result-card">
    <div class="score-row">
      <span class="score-num" id="score-num">–</span>
      <span class="score-denom">/ 10</span>
      <span class="score-emoji" id="score-emoji"></span>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="bar-fill"></div></div>
    <div class="verdict" id="verdict"></div>
    <div class="traits" id="traits"></div>
  </div>
</div>

<script>
let mode = 'camera';
let stream = null;
let capturedDataUrl = null;

// Load saved API key
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('face_rater_api_key');
  if (saved) {
    document.getElementById('api-key-input').value = saved;
    document.getElementById('setup-card').style.background = 'var(--surface2)';
  }
  switchMode('camera');
});

function saveKey() {
  const key = document.getElementById('api-key-input').value.trim();
  if (key) {
    localStorage.setItem('face_rater_api_key', key);
    const card = document.getElementById('setup-card');
    card.style.transition = 'background 0.3s';
    card.style.background = '#eaf3de';
    setTimeout(() => card.style.background = 'var(--surface2)', 1200);
  }
}

function getApiKey() {
  return document.getElementById('api-key-input').value.trim() || localStorage.getItem('face_rater_api_key') || '';
}

function switchMode(m) {
  mode = m;
  retake();
  document.getElementById('tab-camera').classList.toggle('active', m === 'camera');
  document.getElementById('tab-upload').classList.toggle('active', m === 'upload');
  document.getElementById('btn-start').style.display = m === 'camera' ? '' : 'none';
  document.getElementById('btn-snap').style.display = m === 'camera' ? '' : 'none';
  document.getElementById('btn-upload').style.display = m === 'upload' ? '' : 'none';
  document.getElementById('video').style.display = m === 'camera' ? '' : 'none';
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

async function startCamera() {
  setError('');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, facingMode: 'user' } });
    const vid = document.getElementById('video');
    vid.srcObject = stream;
    vid.style.display = '';
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('btn-snap').disabled = false;
    document.getElementById('btn-start').disabled = true;
  } catch(e) {
    setError('Could not access camera. Try the Upload tab instead, or check your browser permissions.');
  }
}

function snap() {
  const vid = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = vid.videoWidth || 640;
  canvas.height = vid.videoHeight || 480;
  canvas.getContext('2d').drawImage(vid, 0, 0);
  capturedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
  showPreview(capturedDataUrl);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function loadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { capturedDataUrl = ev.target.result; showPreview(capturedDataUrl); };
  reader.readAsDataURL(file);
}

function showPreview(dataUrl) {
  const img = document.getElementById('preview-img');
  img.src = dataUrl;
  img.style.display = '';
  document.getElementById('video').style.display = 'none';
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('btn-rate').disabled = false;
  document.getElementById('btn-retake').style.display = '';
  document.getElementById('btn-snap').disabled = true;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('loading').style.display = 'none';
}

function retake() {
  capturedDataUrl = null;
  const img = document.getElementById('preview-img');
  img.style.display = 'none'; img.src = '';
  document.getElementById('placeholder').style.display = '';
  document.getElementById('btn-rate').disabled = true;
  document.getElementById('btn-retake').style.display = 'none';
  document.getElementById('btn-snap').disabled = true;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('file-input').value = '';
  setError('');
}

function setError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = msg ? '' : 'none';
}

async function rateFace() {
  if (!capturedDataUrl) return;
  const apiKey = getApiKey();
  if (!apiKey) { setError('Please enter your Anthropic API key above first.'); return; }

  setError('');
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('btn-rate').disabled = true;

  const base64 = capturedDataUrl.split(',')[1];
  const mediaType = capturedDataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg';

  const systemPrompt = `You are a witty, fun, and encouraging face rating AI. Analyse the face in the image and respond ONLY with valid JSON (no markdown, no preamble) with these exact fields:
{
  "score": <number 1-10, one decimal place>,
  "emoji": "<one emoji matching the score vibe>",
  "verdict": "<2-3 sentences of fun, positive, witty commentary about the face. Be cheeky but never mean. Mention specific visible features.>",
  "traits": ["<trait1>", "<trait2>", "<trait3>", "<trait4>"]
}
Traits should be fun positive descriptors like "Strong jawline", "Expressive eyes", "Radiant skin". If no face is visible, set score to 0 and verdict to "I can't see a face! Make sure your face is clearly visible." Respond ONLY with the JSON object, nothing else.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
          { type: 'text', text: 'Rate my face!' }
        ]}]
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error ${resp.status}`);
    }

    const data = await resp.json();
    const text = (data.content || []).map(b => b.text || '').join('');
    const clean = text.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-rate').disabled = false;
    document.getElementById('result-card').style.display = '';

    const score = Math.min(10, Math.max(0, parseFloat(result.score) || 0));
    document.getElementById('score-num').textContent = score.toFixed(1);
    document.getElementById('score-emoji').textContent = result.emoji || '';
    document.getElementById('verdict').textContent = result.verdict || '';

    const color = score >= 8 ? '#1D9E75' : score >= 5 ? '#EF9F27' : '#E24B4A';
    const fill = document.getElementById('bar-fill');
    fill.style.background = color;
    setTimeout(() => { fill.style.width = (score / 10 * 100).toFixed(0) + '%'; }, 60);

    const traitsEl = document.getElementById('traits');
    traitsEl.innerHTML = '';
    (result.traits || []).forEach(t => {
      const s = document.createElement('span');
      s.className = 'trait';
      s.textContent = t;
      traitsEl.appendChild(s);
    });

  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-rate').disabled = false;
    setError('Error: ' + (e.message || 'Something went wrong. Check your API key and try again.'));
  }
}
</script>
</body>
</html>
